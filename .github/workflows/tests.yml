name: Offline Unit Tests

on:
  push:
    branches: [ main, dev, 'dev-*' ]
  pull_request:
    branches: [ main, dev, 'dev-*' ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  offline-tests:
    name: Offline Tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7  # no floating major tag exists past v7
      with:
        enable-cache: true

    - name: Install dependencies (locked)
      # uv sync --frozen installs the exact versions pinned in uv.lock, so CI
      # and local `uv sync` resolve identical dependencies — no pip
      # "install latest" drift (which previously diverged e.g. json_repair
      # between CI and the lockfile). offline-storage/offline-llm bring the
      # mock-target libraries (qdrant-client, pymongo, anthropic, boto3, ...)
      # the offline suite constructs data classes from; the pytest extra brings
      # pytest/pytest-asyncio/httpx2. Without them importorskip silently skips.
      run: >-
        uv sync --frozen --python ${{ matrix.python-version }}
        --extra api --extra offline-storage --extra offline-llm --extra pytest

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Build WebUI
      # tests/api/test_path_prefixes.py's Mount tests exercise the /webui
      # StaticFiles mount, which create_app only installs when
      # ontorag/api/webui/index.html exists; without a build they skip.
      working-directory: ontorag_webui
      run: |
        bun install --frozen-lockfile
        bun run build

    - name: Run offline tests
      # Run every test that does not need external services. Integration
      # tests (databases/APIs) are skipped by tests/conftest.py unless
      # --run-integration is passed, which is the documented default gate.
      # Do NOT narrow this to `-m offline`: many suites (all of tests/api/,
      # tests/parser/markdown/, ...) carry no marker at all and were silently
      # never run in CI under that filter, letting real failures ship.
      # Tests needing native libcairo skip themselves when it is absent
      # (ubuntu-latest ships libcairo2, so they run here).
      # --no-sync: the environment was already synced above.
      run: uv run --no-sync pytest tests/ -v --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          .pytest_cache/
          test-results.xml
        retention-days: 7
